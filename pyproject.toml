[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "site-tree-md"
version = "0.1.0"
description = "Archive website subtrees into a deterministic URL-shaped Markdown filesystem tree."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "OpenAI"}]
dependencies = [
  "requests>=2.32.0",
  "beautifulsoup4>=4.12.0",
  "markdownify>=0.13.1",
  "trafilatura>=1.9.0",
  "tldextract>=5.1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.11.0",
]
render = [
  "playwright>=1.52",
]
browser = [
  "playwright>=1.52",
]

[project.scripts]
site-tree-md = "site_tree_md.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
